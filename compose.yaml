# Both containers with a locked-down runtime profile. Images come from `make build` /
# `make build-stt` (they run the verification gates), so there is no build: section.
#
#   ports 127.0.0.1:…      the ONLY thing published is the HTTP port, and only on
#                          127.0.0.1 (not your LAN)
#   networks (default)     compose's own project bridge, pardon_default
#   read_only              root filesystem is immutable; /tmp is a small tmpfs
#   cap_drop ALL           no Linux capabilities at all
#   no-new-privileges      setuid/setcap binaries cannot escalate
#   user 65532             non-root (the images already do this; belt and braces)
#   pids_limit/mem_limit   bounded resources; a runaway process cannot starve the Mac
#                          (parakeet's 2500m: its int8 encoder is ~660 MB; measure with
#                          `docker stats` and lower)
#   memswap_limit          equal to mem_limit, so no swap
#   container_name         fixed, so the make targets and docs can address them by name
#   no volumes             the containers cannot see any of your files
#
# compose also reads .env and compose.override.yaml from this directory; either changes this
# profile, so keep neither here (`make test-compose` checks the rendered result).
#
# Tip: after the first run, pin each image to the digest printed by `make digest`
# (`make digest IMAGE=parakeet-stt:local`): KOKORO_IMAGE=kokoro-tts@sha256:… and
# STT_IMAGE=parakeet-stt@sha256:…
name: pardon

services:
  kokoro:
    container_name: kokoro
    image: ${KOKORO_IMAGE:-kokoro-tts:local}
    ports:
      - "127.0.0.1:${KOKORO_PORT:-8880}:8880"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    user: "65532:65532"
    pids_limit: 64
    mem_limit: 1500m
    memswap_limit: 1500m
    cpus: 4
    restart: unless-stopped

  parakeet:
    container_name: parakeet
    image: ${STT_IMAGE:-parakeet-stt:local}
    ports:
      - "127.0.0.1:${STT_PORT:-8881}:8881"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    user: "65532:65532"
    pids_limit: 64
    mem_limit: 2500m
    memswap_limit: 2500m
    cpus: 4
    restart: unless-stopped
